name: RACT Benchmark

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run RACT engine
        run: python RACT/engine.py

      - name: Sandbox iteration 1
        id: sandbox_1
        env:
          RACT_EVENT: >-
            {"event_id":"${{ github.run_id }}","payload":"dynamic-test"}
          RACT_ITERATION: "1"
          RACT_PERTURBATION: "state"
        run: python RACT/sandbox.py

      - name: Run RACT benchmark
        env:
          RACT_CANONICAL_EVENT: ${{ steps.sandbox_1.outputs.next_event }}
          RACT_EXPERIMENT_EVENT: ${{ steps.sandbox_1.outputs.experiment_event }}
          RACT_PERTURBATION: ${{ steps.sandbox_1.outputs.perturbation }}
        run: python RACT/benchmark.py

      - name: Sandbox iteration 2
        id: sandbox_2
        env:
          RACT_EVENT: ${{ steps.sandbox_1.outputs.next_event }}
          RACT_ITERATION: "2"
          RACT_PERTURBATION: "none"
        run: python RACT/sandbox.py
