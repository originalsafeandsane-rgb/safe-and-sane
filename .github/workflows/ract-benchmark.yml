# This is a basic workflow to help you get started with Actions

name: RACT Benchmark

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run RACT engine
        run: python RACT/engine.py

      - name: Run RACT benchmark
        run: python RACT/benchmark.py

      - name: Sandbox iteration 1
        id: sandbox_1
        env:
          RACT_EVENT: >-
            {"event_id":"${{ github.run_id }}","payload":"dynamic-test"}
          RACT_ITERATION: "1"
        run: python RACT/sandbox.py

            - name: Adversarial perturbation
        id: perturb
        env:
          ORIGINAL_EVENT: ${{ steps.sandbox_1.outputs.next_event }}
        run: |
          echo "Original sandbox output:"
          echo "$ORIGINAL_EVENT"

          PERTURBED_EVENT=$(python -c 'import json,sys; e=json.loads(sys.argv[1]); e["payload"]="ADVERSARIAL_PERTURBATION"; print(json.dumps(e))' "$ORIGINAL_EVENT")

          echo "Perturbed sandbox output:"
          echo "$PERTURBED_EVENT"

          echo "next_event=$PERTURBED_EVENT" >> "$GITHUB_OUTPUT"

      - name: Sandbox iteration 2
        id: sandbox_2
        env:
          RACT_EVENT: ${{ steps.perturb.outputs.next_event }}
          RACT_ITERATION: "2"
        run: python RACT/sandbox.py

