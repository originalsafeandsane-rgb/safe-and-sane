name: RACT Benchmark

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run RACT engine
        run: python RACT/engine.py

      - name: Sandbox iteration 1
        id: sandbox_1
        env:
          RACT_EVENT: >-
            {"event_id":"${{ github.run_id }}","payload":"dynamic-test"}
          RACT_ITERATION: "1"
        run: python RACT/sandbox.py

      - name: State perturbation
        id: perturb
        env:
          NEXT_EVENT: ${{ steps.sandbox_1.outputs.next_event }}
        run: |
          echo "ORIGINAL_EVENT:"
          echo "$NEXT_EVENT"

          PERTURBED_EVENT=$(python -c 'import json,sys; e=json.loads(sys.argv[1]); e["state"]="INVALID-STATE"; print(json.dumps(e))' "$NEXT_EVENT")

          echo "PERTURBED_EVENT:"
          echo "$PERTURBED_EVENT"

          echo "next_event=$PERTURBED_EVENT" >> "$GITHUB_OUTPUT"

      - name: Run RACT benchmark
        env:
          RACT_EVENT: ${{ steps.perturb.outputs.next_event }}
          EXPECTED_PAYLOAD: ""
          EXPECTED_PREVIOUS_EVENT_ID: ${{ github.run_id }}
          EXPECTED_STATE: "state-1"
          EXPECTED_ITERATION: "1"
          EXPECTED_SOURCE: "sandbox"
        run: python RACT/benchmark.py

      - name: Sandbox iteration 2
        id: sandbox_2
        env:
          RACT_EVENT: ${{ steps.sandbox_1.outputs.next_event }}
          RACT_ITERATION: "2"
        run: python RACT/sandbox.py
